<script>
const all = document.querySelectorAll('.wobble');

all.forEach(el => {

  text = text.split("");

    let delay = (idx + 1) * 50;
    return `<span style="animation-delay: ${delay}ms">${x}</span>`;
  })

  el.innerHTML = textCode.join("");
